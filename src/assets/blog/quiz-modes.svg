<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="単語の3つの情報から出題と解答の組み合わせが6通りでき、4択と入力の2種類を掛けて12通りになることを示す図。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .h1 { font-size: 17px; font-weight: 700; fill: #0f1219; }
    .h2 { font-size: 16px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 12.5px; fill: #6b7280; }
    .n  { font-size: 13px; fill: #2337ff; font-weight: 700; }
  </style>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#f7f8fc"/>

  <text class="h1" x="60" y="56">1つの単語が持つ3つの情報</text>
  <text class="m"  x="60" y="79">どれを問題にして、どれを答えさせるか。3つから2つ選ぶ順列で6通り。</text>

  <!-- ノード -->
  <rect x="350" y="110" width="200" height="66" rx="12" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text class="h2" x="450" y="140" text-anchor="middle">你好</text>
  <text class="m"  x="450" y="162" text-anchor="middle">中国語（簡体字）</text>

  <rect x="90" y="300" width="200" height="66" rx="12" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text class="h2" x="190" y="330" text-anchor="middle">nǐ hǎo</text>
  <text class="m"  x="190" y="352" text-anchor="middle">ピンイン</text>

  <rect x="610" y="300" width="200" height="66" rx="12" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text class="h2" x="710" y="330" text-anchor="middle">こんにちは</text>
  <text class="m"  x="710" y="352" text-anchor="middle">日本語訳</text>

  <!-- 双方向の辺 -->
  <line x1="356" y1="180" x2="248" y2="294" stroke="#8b93a7" stroke-width="1.5" marker-start="url(#f)" marker-end="url(#f)"/>
  <line x1="544" y1="180" x2="652" y2="294" stroke="#8b93a7" stroke-width="1.5" marker-start="url(#f)" marker-end="url(#f)"/>
  <line x1="300" y1="333" x2="600" y2="333" stroke="#8b93a7" stroke-width="1.5" marker-start="url(#f)" marker-end="url(#f)"/>

  <text class="n" x="252" y="240" text-anchor="middle">往復2通り</text>
  <text class="n" x="650" y="240" text-anchor="middle">往復2通り</text>
  <text class="n" x="450" y="322" text-anchor="middle">往復2通り</text>

  <line x1="60" y1="398" x2="840" y2="398" stroke="#e2e5ee" stroke-width="1.5"/>
  <text class="h2" x="60" y="428">6モード × 2（4択 / 入力）</text>
  <text x="840" y="430" text-anchor="end" font-size="24" font-weight="700" fill="#2337ff" font-family="system-ui, sans-serif">= 12通り</text>
</svg>
