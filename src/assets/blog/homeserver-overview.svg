<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="自宅サーバーの全体構成図。GMKtec M8 上の Proxmox VE に Pi-hole、監視基盤、開発環境が載り、外出先からは Tailscale で接続する。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .h1 { font-size: 18px; font-weight: 700; fill: #0f1219; }
    .h2 { font-size: 14px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 12.5px; fill: #6b7280; }
    .s  { font-size: 11px; fill: #6b7280; }
    .ip { font-size: 12.5px; font-weight: 700; fill: #2337ff; font-family: ui-monospace, Consolas, monospace; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>

  <rect width="1020" height="510" fill="#f7f8fc"/>

  <rect x="40" y="200" width="180" height="80" rx="12" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <text class="h2" x="130" y="235" text-anchor="middle">外出先</text>
  <text class="m"  x="130" y="256" text-anchor="middle">スマホ / ノートPC</text>
  <line x1="222" y1="240" x2="292" y2="240" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="s" x="257" y="231" text-anchor="middle">Tailscale</text>

  <rect x="300" y="70" width="420" height="350" rx="14" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text class="h1" x="320" y="102">GMKtec M8</text>
  <text class="m"  x="320" y="123">Proxmox VE 9.2.2</text>
  <text class="ip" x="700" y="102" text-anchor="end">192.168.11.100</text>

  <rect x="320" y="140" width="380" height="58" rx="8" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="h2" x="337" y="165">CT100  pihole</text>
  <text class="ip" x="683" y="165" text-anchor="end">.101</text>
  <text class="m"  x="337" y="184">DNS広告ブロック</text>

  <rect x="320" y="208" width="380" height="58" rx="8" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="h2" x="337" y="233">CT102  metrics</text>
  <text class="ip" x="683" y="233" text-anchor="end">.102</text>
  <text class="m"  x="337" y="252">InfluxDB + Grafana</text>

  <rect x="320" y="276" width="380" height="58" rx="8" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="h2" x="337" y="301">CT103  monitor</text>
  <text class="ip" x="683" y="301" text-anchor="end">.103</text>
  <text class="m"  x="337" y="320">Uptime Kuma</text>

  <rect x="320" y="344" width="380" height="58" rx="8" fill="#fff8ef" stroke="#f0d9b5"/>
  <text class="h2" x="337" y="369">VM101  ubuntu</text>
  <text class="ip" x="683" y="369" text-anchor="end">.15</text>
  <text class="m"  x="337" y="388">開発環境 + 中国語アプリ</text>

  <rect x="772" y="190" width="208" height="96" rx="12" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <text class="h2" x="790" y="220">Raspberry Pi 5</text>
  <text class="ip" x="962" y="220" text-anchor="end">.14</text>
  <text class="m"  x="790" y="244">Obsidian同期 (CouchDB)</text>
  <text class="m"  x="790" y="266">Telegraf でメトリクス送信</text>
  <line x1="770" y1="237" x2="706" y2="237" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="300" y="438" width="420" height="42" rx="10" fill="#ffffff" stroke="#d5d9e6" stroke-dasharray="5 4"/>
  <text class="m" x="510" y="464" text-anchor="middle">毎週日曜 3:00 — 自動バックアップ（3世代を保持）</text>
</svg>
