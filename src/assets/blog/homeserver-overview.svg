<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="自宅サーバーの構成図。GMKtec M8 上の Proxmox VE に Pi-hole、監視基盤、開発環境が載り、外出先からは Tailscale で接続する。毎週日曜3時に自動バックアップを3世代保持する。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .h1 { font-size: 18px; font-weight: 700; fill: #0f1219; }
    .h2 { font-size: 14px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 12.5px; fill: #6b7280; }
    .s  { font-size: 11px; fill: #6b7280; }
    .ip { font-size: 12.5px; font-weight: 700; fill: #2337ff; font-family: ui-monospace, Consolas, monospace; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>

  <rect width="1020" height="510" fill="#f7f8fc"/>

  <!-- 外出先 -->
  <rect x="40" y="215" width="180" height="80" rx="12" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <text class="h2" x="130" y="250" text-anchor="middle">外出先</text>
  <text class="m"  x="130" y="271" text-anchor="middle">スマホ / ノートPC</text>
  <line x1="222" y1="255" x2="292" y2="255" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="s" x="257" y="246" text-anchor="middle">Tailscale</text>

  <!-- M8 本体 -->
  <rect x="300" y="60" width="420" height="390" rx="14" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text class="h1" x="320" y="92">GMKtec M8</text>
  <text class="m"  x="320" y="113">Proxmox VE 9.2.2</text>
  <text class="ip" x="700" y="92" text-anchor="end">192.168.11.100</text>

  <rect x="320" y="134" width="380" height="60" rx="8" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="h2" x="337" y="160">CT100  pihole</text>
  <text class="ip" x="683" y="160" text-anchor="end">.101</text>
  <text class="m"  x="337" y="180">DNS広告ブロック</text>

  <rect x="320" y="206" width="380" height="60" rx="8" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="h2" x="337" y="232">CT102  metrics</text>
  <text class="ip" x="683" y="232" text-anchor="end">.102</text>
  <text class="m"  x="337" y="252">InfluxDB + Grafana</text>

  <rect x="320" y="278" width="380" height="60" rx="8" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="h2" x="337" y="304">CT103  monitor</text>
  <text class="ip" x="683" y="304" text-anchor="end">.103</text>
  <text class="m"  x="337" y="324">Uptime Kuma</text>

  <rect x="320" y="350" width="380" height="60" rx="8" fill="#fff8ef" stroke="#f0d9b5"/>
  <text class="h2" x="337" y="376">VM101  ubuntu</text>
  <text class="ip" x="683" y="376" text-anchor="end">.15</text>
  <text class="m"  x="337" y="396">開発環境 + 中国語アプリ</text>

  <text class="s" x="510" y="436" text-anchor="middle">CT = LXC コンテナ　VM = 仮想マシン</text>

  <!-- バックアップ -->
  <line x1="722" y1="255" x2="778" y2="255" stroke="#8b93a7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="782" y="205" width="198" height="100" rx="12" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="h2" x="881" y="236" text-anchor="middle">自動バックアップ</text>
  <text class="m"  x="881" y="260" text-anchor="middle">毎週日曜 3:00</text>
  <text class="m"  x="881" y="281" text-anchor="middle">3世代を保持</text>
</svg>
