<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="記事のアイキャッチ。家中の広告をDNSで消す、Pi-hole on Proxmox。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .t  { font-size: 46px; font-weight: 700; fill: #0f1219; }
    .s  { font-size: 18px; fill: #6b7280; }
    .cp { font-size: 14px; font-weight: 700; fill: #2337ff; }
    .d  { font-size: 15px; fill: #4b5563; font-family: ui-monospace, Consolas, monospace; }
    .dx { font-size: 15px; fill: #b6bcc9; font-family: ui-monospace, Consolas, monospace; }
    .z  { font-size: 13px; font-weight: 700; fill: #e5484d; font-family: ui-monospace, Consolas, monospace; }
  </style>
  <rect width="1020" height="510" fill="#f7f8fc"/>
  <rect x="0" y="0" width="10" height="510" fill="#2337ff"/>

  <text class="t" x="70" y="205">家中の広告を</text>
  <text class="t" x="70" y="263">DNSで消す</text>
  <text class="s" x="70" y="308">Pi-hole を Proxmox の LXC に立てる</text>

  <rect x="70" y="345" width="112" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="126" y="365" text-anchor="middle">Pi-hole</text>
  <rect x="192" y="345" width="100" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="242" y="365" text-anchor="middle">Proxmox</text>
  <rect x="302" y="345" width="72" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="338" y="365" text-anchor="middle">DNS</text>

  <!-- モチーフ: ドメインの通過と遮断 -->
  <rect x="600" y="120" width="350" height="60" rx="12" fill="#ffffff" stroke="#d5d9e6"/>
  <text class="d" x="622" y="157">example.com</text>
  <circle cx="912" cy="150" r="12" fill="#f2fbf5" stroke="#b8e2c8"/>
  <path d="M906 150 l4 5 l8 -10" fill="none" stroke="#2f9e5e" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="600" y="196" width="350" height="60" rx="12" fill="#ffffff" stroke="#f0c4c4"/>
  <text class="dx" x="622" y="233">ads.example.com</text>
  <line x1="618" y1="228" x2="770" y2="228" stroke="#e5484d" stroke-width="2"/>
  <text class="z" x="900" y="233" text-anchor="end">0.0.0.0</text>

  <rect x="600" y="272" width="350" height="60" rx="12" fill="#ffffff" stroke="#f0c4c4"/>
  <text class="dx" x="622" y="309">tracker.example.net</text>
  <line x1="618" y1="304" x2="800" y2="304" stroke="#e5484d" stroke-width="2"/>
  <text class="z" x="900" y="309" text-anchor="end">0.0.0.0</text>

  <rect x="600" y="348" width="350" height="60" rx="12" fill="#ffffff" stroke="#d5d9e6"/>
  <text class="d" x="622" y="385">news.example.jp</text>
  <circle cx="912" cy="378" r="12" fill="#f2fbf5" stroke="#b8e2c8"/>
  <path d="M906 378 l4 5 l8 -10" fill="none" stroke="#2f9e5e" stroke-width="2.2" stroke-linecap="round"/>
</svg>
