<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-label="Nginx をリバースプロキシに置いた3コンテナ構成。ルートはReactの静的ファイル、/apiはFlaskへ転送し、FlaskはPostgreSQLに接続する。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .h2 { font-size: 15px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 12.5px; fill: #6b7280; }
    .c  { font-size: 12.5px; fill: #2337ff; font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
    .cm { font-size: 12px; fill: #6b7280; font-family: ui-monospace, Consolas, monospace; }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>
  <rect width="980" height="420" fill="#f7f8fc"/>

  <rect x="40" y="160" width="150" height="76" rx="12" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <text class="h2" x="115" y="193" text-anchor="middle">ブラウザ</text>
  <text class="m"  x="115" y="215" text-anchor="middle">同一オリジン</text>
  <line x1="192" y1="198" x2="268" y2="198" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#c)"/>
  <text class="cm" x="230" y="188" text-anchor="middle">:8080</text>

  <rect x="272" y="118" width="210" height="160" rx="12" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text class="h2" x="377" y="152" text-anchor="middle">Nginx</text>
  <text class="m"  x="377" y="176" text-anchor="middle">リバースプロキシ</text>
  <line x1="292" y1="192" x2="462" y2="192" stroke="#e2e5ee" stroke-width="1.5"/>
  <text class="c"  x="292" y="217">/</text>
  <text class="m"  x="316" y="217">React の dist を配信</text>
  <text class="c"  x="292" y="247">/api</text>
  <text class="m"  x="332" y="247">Flask へ転送</text>

  <path d="M484 240 C 520 240, 520 268, 556 268" fill="none" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#c)"/>

  <rect x="560" y="236" width="180" height="70" rx="12" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <text class="h2" x="650" y="266" text-anchor="middle">Flask</text>
  <text class="m"  x="650" y="288" text-anchor="middle">gunicorn ワーカー2</text>

  <line x1="742" y1="271" x2="798" y2="271" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#c)"/>

  <rect x="802" y="236" width="140" height="70" rx="12" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="h2" x="872" y="266" text-anchor="middle">PostgreSQL</text>
  <text class="m"  x="872" y="288" text-anchor="middle">データ永続化</text>

  <rect x="560" y="118" width="382" height="70" rx="12" fill="#f2fbf5" stroke="#b8e2c8"/>
  <text class="h2" x="751" y="147" text-anchor="middle">CORS の設定が不要になる</text>
  <text class="m"  x="751" y="169" text-anchor="middle">フロントと API が同じオリジンから配信されるため</text>

  <text class="m" x="40" y="358">Render では別ドメインだったので FRONTEND_URL を渡して CORS を許可していた。その仕組みごと不要になった。</text>
</svg>
