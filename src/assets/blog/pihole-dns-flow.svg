<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-label="Pi-hole のDNS問い合わせの流れ。ブロックリストにないドメインは上流DNSへ転送され、あるドメインには0.0.0.0が返る。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .h2 { font-size: 14.5px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 12.5px; fill: #6b7280; }
    .s  { font-size: 12px; font-weight: 700; fill: #2337ff; }
    .c  { font-size: 15px; fill: #0f1219; font-family: ui-monospace, Consolas, monospace; }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>
  <rect width="980" height="400" fill="#f7f8fc"/>

  <rect x="40" y="165" width="150" height="70" rx="12" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <text class="h2" x="115" y="194" text-anchor="middle">スマホ / PC</text>
  <text class="m"  x="115" y="215" text-anchor="middle">家の全機器</text>
  <line x1="192" y1="200" x2="250" y2="200" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="255" y="145" width="200" height="110" rx="12" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text class="h2" x="355" y="182" text-anchor="middle">Pi-hole</text>
  <text class="m"  x="355" y="204" text-anchor="middle">ブロックリストと照合</text>
  <text class="m"  x="355" y="228" text-anchor="middle">192.168.11.101</text>

  <path d="M457 178 C 500 178, 500 110, 538 110" fill="none" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#b)"/>
  <text class="s" x="468" y="130">リストにない</text>
  <rect x="545" y="78" width="175" height="64" rx="10" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <text class="h2" x="632" y="104" text-anchor="middle">上流DNSへ転送</text>
  <text class="m"  x="632" y="125" text-anchor="middle">1.1.1.1 など</text>
  <line x1="722" y1="110" x2="778" y2="110" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="782" y="78" width="158" height="64" rx="10" fill="#f2fbf5" stroke="#b8e2c8"/>
  <text class="h2" x="861" y="104" text-anchor="middle">正しいIPが返る</text>
  <text class="m"  x="861" y="125" text-anchor="middle">通常どおり表示</text>

  <path d="M457 222 C 500 222, 500 292, 538 292" fill="none" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#b)"/>
  <text class="s" x="468" y="290">リストにある</text>
  <rect x="545" y="260" width="175" height="64" rx="10" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <text class="c"  x="632" y="290" text-anchor="middle">0.0.0.0</text>
  <text class="m"  x="632" y="310" text-anchor="middle">を返す</text>
  <line x1="722" y1="292" x2="778" y2="292" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="782" y="260" width="158" height="64" rx="10" fill="#fdf3f3" stroke="#f0c4c4"/>
  <text class="h2" x="861" y="286" text-anchor="middle">接続できない</text>
  <text class="m"  x="861" y="307" text-anchor="middle">＝広告が消える</text>

  <text class="m" x="40" y="366">「どこでもない場所」を返すので、端末は広告サーバーに到達できない</text>
</svg>
