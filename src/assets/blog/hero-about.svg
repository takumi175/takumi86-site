<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="Aboutページのヘッダー画像。Web開発、自宅サーバー、学習記録の3つを扱っていることを示す。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .t  { font-size: 54px; font-weight: 700; fill: #0f1219; }
    .s  { font-size: 19px; fill: #6b7280; }
    .cp { font-size: 14px; font-weight: 700; fill: #2337ff; }
    .b  { font-size: 15px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 12.5px; fill: #6b7280; }
  </style>
  <rect width="1020" height="510" fill="#f7f8fc"/>
  <rect x="0" y="0" width="10" height="510" fill="#2337ff"/>

  <text class="t" x="70" y="228">About</text>
  <text class="s" x="70" y="272">つくったものと、そこで詰まったことの記録</text>

  <rect x="70" y="312" width="86" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="113" y="332" text-anchor="middle">Takumi</text>
  <rect x="166" y="312" width="110" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="221" y="332" text-anchor="middle">情報工学部</text>

  <!-- モチーフ: 3つの領域 -->
  <rect x="566" y="96" width="394" height="94" rx="14" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <rect x="590" y="126" width="34" height="34" rx="8" fill="#eef0ff"/>
  <path d="M600 136 l-5 7 l5 7 M614 136 l5 7 l-5 7" fill="none" stroke="#2337ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="b" x="644" y="139">Web アプリ開発</text>
  <text class="m" x="644" y="161">React / Vue / Flask / FastAPI</text>

  <rect x="566" y="206" width="394" height="94" rx="14" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <rect x="590" y="236" width="34" height="34" rx="8" fill="#eef0ff"/>
  <rect x="597" y="243" width="20" height="7" rx="2" fill="#2337ff"/>
  <rect x="597" y="253" width="20" height="7" rx="2" fill="#2337ff" opacity="0.55"/>
  <text class="b" x="644" y="249">自宅サーバー</text>
  <text class="m" x="644" y="271">Proxmox / Docker / Tailscale</text>

  <rect x="566" y="316" width="394" height="94" rx="14" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <rect x="590" y="346" width="34" height="34" rx="8" fill="#eef0ff"/>
  <path d="M598 354 h18 M598 363 h18 M598 372 h11" fill="none" stroke="#2337ff" stroke-width="2.2" stroke-linecap="round"/>
  <text class="b" x="644" y="359">学習と記録</text>
  <text class="m" x="644" y="381">基本情報技術者 / 中国語 / TOEIC</text>
</svg>
