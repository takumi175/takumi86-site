<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="記事のアイキャッチ。デスク環境を整えた記録。モニター、キーボード、ミニPCが並ぶデスクのイラスト。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .t  { font-size: 46px; font-weight: 700; fill: #0f1219; }
    .s  { font-size: 18px; fill: #6b7280; }
    .cp { font-size: 14px; font-weight: 700; fill: #2337ff; }
  </style>
  <rect width="1020" height="510" fill="#f7f8fc"/>
  <rect x="0" y="0" width="10" height="510" fill="#2337ff"/>

  <text class="t" x="70" y="205">デスク環境を</text>
  <text class="t" x="70" y="263">整えた</text>
  <text class="s" x="70" y="308">買ってよかったもの、そうでもなかったもの</text>

  <rect x="70" y="345" width="90" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="115" y="365" text-anchor="middle">買い物</text>
  <rect x="170" y="345" width="112" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="226" y="365" text-anchor="middle">デスク環境</text>

  <!-- モニター -->
  <rect x="620" y="120" width="290" height="168" rx="10" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <rect x="640" y="140" width="250" height="128" rx="4" fill="#f4f6ff"/>
  <rect x="656" y="156" width="106" height="9" rx="4.5" fill="#ccd3f5"/>
  <rect x="656" y="174" width="150" height="9" rx="4.5" fill="#e2e5ee"/>
  <rect x="656" y="192" width="128" height="9" rx="4.5" fill="#e2e5ee"/>
  <rect x="656" y="222" width="72" height="9" rx="4.5" fill="#ccd3f5"/>
  <rect x="750" y="288" width="30" height="34" fill="#d5d9e6"/>
  <rect x="700" y="322" width="130" height="10" rx="5" fill="#c9cfdd"/>

  <!-- デスク天板 -->
  <rect x="560" y="352" width="410" height="12" rx="6" fill="#d5d9e6"/>

  <!-- キーボード -->
  <rect x="646" y="374" width="240" height="46" rx="8" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <g fill="#e2e5ee">
    <rect x="660" y="386" width="18" height="9" rx="2"/>
    <rect x="684" y="386" width="18" height="9" rx="2"/>
    <rect x="708" y="386" width="18" height="9" rx="2"/>
    <rect x="732" y="386" width="18" height="9" rx="2"/>
    <rect x="756" y="386" width="18" height="9" rx="2"/>
    <rect x="780" y="386" width="18" height="9" rx="2"/>
    <rect x="804" y="386" width="18" height="9" rx="2"/>
    <rect x="828" y="386" width="18" height="9" rx="2"/>
    <rect x="660" y="401" width="42" height="9" rx="2"/>
    <rect x="708" y="401" width="114" height="9" rx="2"/>
    <rect x="828" y="401" width="18" height="9" rx="2"/>
  </g>

  <!-- マウス -->
  <rect x="900" y="378" width="30" height="42" rx="15" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <line x1="915" y1="386" x2="915" y2="396" stroke="#d5d9e6" stroke-width="1.5"/>

  <!-- ミニPC -->
  <rect x="566" y="300" width="64" height="52" rx="8" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <circle cx="582" cy="340" r="3.5" fill="#2337ff"/>
</svg>
