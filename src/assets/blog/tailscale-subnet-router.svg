<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" width="1020" height="440" role="img" aria-label="Tailscale のサブネットルーターの有無による違い。なしの場合はM8にしか届かず、ありの場合はLAN全体に届く。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .h1 { font-size: 15px; font-weight: 700; fill: #0f1219; }
    .h2 { font-size: 13.5px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 12px; fill: #6b7280; }
    .cm { font-size: 11.5px; fill: #6b7280; font-family: ui-monospace, Consolas, monospace; }
    .ng { font-size: 13px; font-weight: 700; fill: #e5484d; }
    .ok { font-size: 13px; font-weight: 700; fill: #2f9e5e; }
  </style>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="1020" height="440" fill="#f7f8fc"/>

  <!-- 左パネル -->
  <rect x="40" y="40" width="440" height="366" rx="14" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <text class="h1" x="64" y="74">サブネットルーターなし</text>
  <text class="m"  x="64" y="96">M8 に Tailscale を入れただけの状態</text>

  <rect x="150" y="118" width="220" height="52" rx="10" fill="#f7f8fc" stroke="#d5d9e6"/>
  <text class="h2" x="260" y="149" text-anchor="middle">外出先のスマホ</text>
  <line x1="260" y1="172" x2="260" y2="208" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#d)"/>
  <text class="ok" x="278" y="196">届く</text>

  <rect x="150" y="212" width="220" height="60" rx="10" fill="#f4f6ff" stroke="#2337ff" stroke-width="1.5"/>
  <text class="h2" x="260" y="238" text-anchor="middle">M8 (Proxmox)</text>
  <text class="cm" x="260" y="258" text-anchor="middle">100.98.158.36:8006</text>

  <line x1="260" y1="274" x2="260" y2="310" stroke="#e5484d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#e)"/>
  <text class="ng" x="278" y="298">届かない</text>

  <rect x="150" y="314" width="220" height="60" rx="10" fill="#fdf3f3" stroke="#f0c4c4"/>
  <text class="h2" x="260" y="340" text-anchor="middle">LAN 上の他の機器</text>
  <text class="cm" x="260" y="360" text-anchor="middle">192.168.11.102:3000</text>

  <!-- 右パネル -->
  <rect x="540" y="40" width="440" height="366" rx="14" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text class="h1" x="564" y="74">サブネットルーターあり</text>
  <text class="cm" x="564" y="96">tailscale up --advertise-routes=192.168.11.0/24</text>

  <rect x="650" y="118" width="220" height="52" rx="10" fill="#f7f8fc" stroke="#d5d9e6"/>
  <text class="h2" x="760" y="149" text-anchor="middle">外出先のスマホ</text>
  <line x1="760" y1="172" x2="760" y2="208" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#d)"/>
  <text class="ok" x="778" y="196">届く</text>

  <rect x="650" y="212" width="220" height="60" rx="10" fill="#f4f6ff" stroke="#2337ff" stroke-width="1.5"/>
  <text class="h2" x="760" y="238" text-anchor="middle">M8 が経路を広告</text>
  <text class="m"  x="760" y="258" text-anchor="middle">LAN 全体への入口になる</text>

  <line x1="760" y1="274" x2="760" y2="310" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#d)"/>
  <text class="ok" x="778" y="298">届く</text>

  <rect x="650" y="314" width="220" height="60" rx="10" fill="#f2fbf5" stroke="#b8e2c8"/>
  <text class="h2" x="760" y="340" text-anchor="middle">LAN 上の他の機器</text>
  <text class="cm" x="760" y="360" text-anchor="middle">192.168.11.102:3000</text>
</svg>
