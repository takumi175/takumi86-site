<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="同じ本体の2つのLANポートの実効速度比較。ポート1は43.6KB/s、ポート2は2.36MB/sで56倍の差がある。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .h1 { font-size: 21px; font-weight: 700; fill: #0f1219; }
    .h2 { font-size: 15px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 13.5px; fill: #6b7280; }
    .v  { font-size: 20px; font-weight: 700; fill: #0f1219; font-family: ui-monospace, Consolas, monospace; }
    .vw { font-size: 20px; font-weight: 700; fill: #ffffff; font-family: ui-monospace, Consolas, monospace; }
  </style>
  <rect width="1020" height="510" fill="#f7f8fc"/>

  <text class="h1" x="60" y="76">同じ本体の2つのLANポート、実効速度の差</text>
  <text class="m"  x="60" y="103">リンク速度はどちらも 1000Mb/s、ケーブルも同じ CAT6a。挿し替えただけ。</text>
  <line x1="60" y1="127" x2="960" y2="127" stroke="#e2e5ee" stroke-width="1.5"/>

  <text class="h2" x="60" y="184">LANポート ①</text>
  <rect x="60" y="200" width="15" height="46" rx="4" fill="#e5484d"/>
  <text class="v" x="94" y="226">43.6 KB/s</text>
  <text class="m" x="94" y="247">124MB のダウンロードに 48分</text>

  <text class="h2" x="60" y="326">LANポート ②</text>
  <rect x="60" y="342" width="830" height="46" rx="4" fill="#2337ff"/>
  <text class="vw" x="84" y="372">2.36 MB/s</text>
  <text class="m"  x="60" y="410">124MB のダウンロードに 52秒</text>

  <text x="960" y="276" text-anchor="end" font-size="44" font-weight="700" fill="#2337ff" font-family="system-ui, sans-serif">56倍</text>
  <text class="m" x="960" y="300" text-anchor="end">の差</text>
</svg>
