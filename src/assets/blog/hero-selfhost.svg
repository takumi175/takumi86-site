<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="記事のアイキャッチ。Render をやめて自宅に置く。React、Flask、PostgreSQL を Docker Compose で自宅サーバーへ移行する。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .t  { font-size: 46px; font-weight: 700; fill: #0f1219; }
    .s  { font-size: 18px; fill: #6b7280; }
    .cp { font-size: 14px; font-weight: 700; fill: #2337ff; }
    .b  { font-size: 15px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 13px; fill: #6b7280; }
    .g  { font-size: 15px; font-weight: 700; fill: #b6bcc9; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2337ff"/>
    </marker>
  </defs>
  <rect width="1020" height="510" fill="#f7f8fc"/>
  <rect x="0" y="0" width="10" height="510" fill="#2337ff"/>

  <text class="t" x="70" y="205">Render をやめて</text>
  <text class="t" x="70" y="263">自宅に置く</text>
  <text class="s" x="70" y="308">スリープしない、待たされない</text>

  <rect x="70" y="345" width="86" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="113" y="365" text-anchor="middle">Docker</text>
  <rect x="166" y="345" width="78" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="205" y="365" text-anchor="middle">Nginx</text>
  <rect x="254" y="345" width="74" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="291" y="365" text-anchor="middle">Flask</text>

  <!-- 移行前 -->
  <rect x="576" y="150" width="150" height="210" rx="14" fill="#ffffff" stroke="#d5d9e6" stroke-dasharray="6 5"/>
  <text class="g" x="651" y="186" text-anchor="middle">Render</text>
  <text class="m" x="651" y="232" text-anchor="middle">15分で</text>
  <text class="m" x="651" y="254" text-anchor="middle">スリープ</text>
  <text class="g" x="651" y="300" text-anchor="middle">30秒待つ</text>

  <line x1="742" y1="255" x2="800" y2="255" stroke="#2337ff" stroke-width="2" marker-end="url(#h)"/>

  <!-- 移行後: 自宅 -->
  <path d="M812 150 L887 108 L962 150 Z" fill="#eef0ff" stroke="#2337ff" stroke-width="2" stroke-linejoin="round"/>
  <rect x="812" y="150" width="150" height="210" rx="12" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>

  <rect x="830" y="172" width="114" height="48" rx="8" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="b" x="887" y="195" text-anchor="middle">Nginx</text>
  <text class="m" x="887" y="212" text-anchor="middle">静的配信 + 転送</text>

  <rect x="830" y="228" width="114" height="48" rx="8" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="b" x="887" y="251" text-anchor="middle">Flask</text>
  <text class="m" x="887" y="268" text-anchor="middle">gunicorn</text>

  <rect x="830" y="284" width="114" height="48" rx="8" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="b" x="887" y="307" text-anchor="middle">PostgreSQL</text>
  <text class="m" x="887" y="324" text-anchor="middle">常時起動</text>
</svg>
