<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="記事のアイキャッチ。400語を12通りで覚える。React と Flask で作った中国語単語クイズアプリ。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .t  { font-size: 46px; font-weight: 700; fill: #0f1219; }
    .s  { font-size: 18px; fill: #6b7280; }
    .cp { font-size: 14px; font-weight: 700; fill: #2337ff; }
    .m  { font-size: 13px; fill: #6b7280; }
    .zh { font-size: 64px; font-weight: 700; fill: #0f1219; }
    .py { font-size: 24px; fill: #2337ff; font-family: ui-monospace, Consolas, monospace; }
    .jp { font-size: 24px; font-weight: 700; fill: #0f1219; }
  </style>
  <defs>
    <marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>
  <rect width="1020" height="510" fill="#f7f8fc"/>
  <rect x="0" y="0" width="10" height="510" fill="#2337ff"/>

  <text class="t" x="70" y="205">400語を</text>
  <text class="t" x="70" y="263">12通りで覚える</text>
  <text class="s" x="70" y="308">React + Flask で作った単語クイズアプリ</text>

  <rect x="70" y="345" width="76" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="108" y="365" text-anchor="middle">React</text>
  <rect x="156" y="345" width="74" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="193" y="365" text-anchor="middle">Flask</text>
  <rect x="240" y="345" width="110" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="295" y="365" text-anchor="middle">PostgreSQL</text>

  <!-- 単語カード -->
  <rect x="586" y="112" width="374" height="286" rx="18" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>

  <text class="zh" x="773" y="200" text-anchor="middle">你好</text>
  <line x1="640" y1="232" x2="906" y2="232" stroke="#e2e5ee" stroke-width="1.5"/>
  <text class="py" x="773" y="272" text-anchor="middle">nǐ hǎo</text>
  <text class="jp" x="773" y="318" text-anchor="middle">こんにちは</text>

  <line x1="660" y1="352" x2="886" y2="352" stroke="#8b93a7" stroke-width="1.5" marker-start="url(#i)" marker-end="url(#i)"/>
  <text class="m" x="773" y="378" text-anchor="middle">どれを問題にして、どれを答えるか</text>
</svg>
