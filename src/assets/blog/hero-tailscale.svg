<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="記事のアイキャッチ。ポートを開けずに外から入る。Tailscale のサブネットルーターで外出先から自宅LANへ接続する。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .t  { font-size: 46px; font-weight: 700; fill: #0f1219; }
    .s  { font-size: 18px; fill: #6b7280; }
    .cp { font-size: 14px; font-weight: 700; fill: #2337ff; }
    .b  { font-size: 14px; font-weight: 700; fill: #0f1219; }
    .m  { font-size: 12.5px; fill: #6b7280; }
  </style>
  <rect width="1020" height="510" fill="#f7f8fc"/>
  <rect x="0" y="0" width="10" height="510" fill="#2337ff"/>

  <text class="t" x="70" y="205">ポートを開けずに</text>
  <text class="t" x="70" y="263">外から入る</text>
  <text class="s" x="70" y="308">Tailscale のサブネットルーター</text>

  <rect x="70" y="345" width="98" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="119" y="365" text-anchor="middle">Tailscale</text>
  <rect x="178" y="345" width="112" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="234" y="365" text-anchor="middle">WireGuard</text>
  <rect x="300" y="345" width="70" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="335" y="365" text-anchor="middle">VPN</text>

  <!-- スマホ -->
  <rect x="566" y="188" width="76" height="128" rx="12" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <rect x="578" y="204" width="52" height="88" rx="4" fill="#f4f6ff"/>
  <text class="m" x="604" y="336" text-anchor="middle">外出先</text>

  <!-- トンネル -->
  <line x1="654" y1="252" x2="800" y2="252" stroke="#2337ff" stroke-width="2.5" stroke-dasharray="9 6"/>
  <circle cx="727" cy="252" r="26" fill="#eef0ff" stroke="#2337ff" stroke-width="2"/>
  <rect x="719" y="248" width="16" height="13" rx="2.5" fill="#2337ff"/>
  <path d="M722 248 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke="#2337ff" stroke-width="2.2"/>
  <text class="m" x="727" y="308" text-anchor="middle">暗号化された経路</text>
  <text class="m" x="727" y="200" text-anchor="middle">ポート開放なし</text>

  <!-- 自宅LAN -->
  <circle cx="884" cy="252" r="86" fill="#ffffff" stroke="#2337ff" stroke-width="2"/>
  <text class="b" x="884" y="196" text-anchor="middle">自宅LAN</text>
  <rect x="822" y="212" width="124" height="30" rx="7" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="m" x="884" y="232" text-anchor="middle">Proxmox</text>
  <rect x="822" y="248" width="124" height="30" rx="7" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="m" x="884" y="268" text-anchor="middle">Grafana</text>
  <rect x="822" y="284" width="124" height="30" rx="7" fill="#f4f6ff" stroke="#ccd3f5"/>
  <text class="m" x="884" y="304" text-anchor="middle">Pi-hole</text>
</svg>
