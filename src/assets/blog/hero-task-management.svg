<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" role="img" aria-label="記事のアイキャッチ。終わらせるとキャラが育つ。6人チームのハッカソンで作ったタスク管理アプリ。">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .t  { font-size: 46px; font-weight: 700; fill: #0f1219; }
    .s  { font-size: 18px; fill: #6b7280; }
    .cp { font-size: 14px; font-weight: 700; fill: #2337ff; }
    .b  { font-size: 15px; font-weight: 700; fill: #0f1219; }
    .bd { font-size: 15px; fill: #b6bcc9; }
    .m  { font-size: 12.5px; fill: #6b7280; }
    .x  { font-size: 13px; font-weight: 700; fill: #2337ff; font-family: ui-monospace, Consolas, monospace; }
  </style>
  <rect width="1020" height="510" fill="#f7f8fc"/>
  <rect x="0" y="0" width="10" height="510" fill="#2337ff"/>

  <text class="t" x="70" y="205">終わらせると</text>
  <text class="t" x="70" y="263">キャラが育つ</text>
  <text class="s" x="70" y="308">6人チームで作ったタスク管理アプリ</text>

  <rect x="70" y="345" width="66" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="103" y="365" text-anchor="middle">Vue</text>
  <rect x="146" y="345" width="92" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="192" y="365" text-anchor="middle">FastAPI</text>
  <rect x="248" y="345" width="86" height="30" rx="15" fill="#eef0ff"/>
  <text class="cp" x="291" y="365" text-anchor="middle">Gemini</text>

  <!-- タスクリスト -->
  <rect x="566" y="118" width="394" height="128" rx="14" fill="#ffffff" stroke="#d5d9e6" stroke-width="1.5"/>
  <rect x="588" y="140" width="22" height="22" rx="5" fill="#2337ff"/>
  <path d="M593 151 l4 5 l8 -10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <text class="bd" x="624" y="158">レポートを提出する</text>
  <line x1="624" y1="152" x2="768" y2="152" stroke="#b6bcc9" stroke-width="1.5"/>
  <text class="x" x="938" y="158" text-anchor="end">+10 EXP</text>

  <rect x="588" y="176" width="22" height="22" rx="5" fill="#2337ff"/>
  <path d="M593 187 l4 5 l8 -10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <text class="bd" x="624" y="194">買い物に行く</text>
  <line x1="624" y1="188" x2="726" y2="188" stroke="#b6bcc9" stroke-width="1.5"/>
  <text class="x" x="938" y="194" text-anchor="end">+10 EXP</text>

  <rect x="588" y="212" width="22" height="22" rx="5" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.8"/>
  <text class="b" x="624" y="230">ブログを書く</text>

  <!-- 経験値バー -->
  <rect x="566" y="272" width="394" height="16" rx="8" fill="#e6e9f2"/>
  <rect x="566" y="272" width="252" height="16" rx="8" fill="#2337ff"/>
  <text class="m" x="566" y="310">レベル 3</text>
  <text class="m" x="960" y="310" text-anchor="end">次のステージまで あと 20 EXP</text>

  <!-- ステージ -->
  <ellipse cx="640" cy="392" rx="26" ry="32" fill="#ffffff" stroke="#c9cfdd" stroke-width="2"/>
  <text class="m" x="640" y="450" text-anchor="middle">egg</text>

  <ellipse cx="763" cy="396" rx="30" ry="28" fill="#f4f6ff" stroke="#2337ff" stroke-width="2"/>
  <circle cx="753" cy="390" r="3.2" fill="#2337ff"/>
  <circle cx="773" cy="390" r="3.2" fill="#2337ff"/>
  <path d="M755 404 q8 6 16 0" fill="none" stroke="#2337ff" stroke-width="2" stroke-linecap="round"/>
  <text class="m" x="763" y="450" text-anchor="middle">baby</text>

  <ellipse cx="890" cy="392" rx="38" ry="34" fill="#f2fbf5" stroke="#2f9e5e" stroke-width="2"/>
  <circle cx="877" cy="384" r="3.6" fill="#2f9e5e"/>
  <circle cx="903" cy="384" r="3.6" fill="#2f9e5e"/>
  <path d="M878 401 q12 8 24 0" fill="none" stroke="#2f9e5e" stroke-width="2.2" stroke-linecap="round"/>
  <text class="m" x="890" y="450" text-anchor="middle">adult</text>

  <path d="M672 392 L726 392" stroke="#8b93a7" stroke-width="1.5"/>
  <path d="M797 392 L846 392" stroke="#8b93a7" stroke-width="1.5"/>
</svg>
